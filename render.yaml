services:
  - type: web
    name: bia601-recommender
    runtime: python
    plan: free
    rootDir: test_algo
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
