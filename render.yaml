services:
  # Single deployment: full store + DT/GA hybrid recommender + GA playground at /playground
  - type: web
    name: bia601-recommender
    runtime: python
    plan: free
    rootDir: store
    buildCommand: pip install -r requirements.txt && python ../seed/excel_to_sqlite.py
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
