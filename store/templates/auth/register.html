{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create Account</h1>
  <form method="post" class="form">
    <label>Username <input name="username" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" required minlength="4"></label>
    <label>Full name <input name="full_name"></label>
    <label>Age <input name="age" type="number" min="1" max="120"></label>
    <label>Location <input name="location"></label>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</section>
{% endblock %}
