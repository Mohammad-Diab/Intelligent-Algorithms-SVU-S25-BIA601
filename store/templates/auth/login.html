{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>تسجيل الدخول</h1>
  <form method="post" class="form">
    <label>اسم المستخدم أو البريد الإلكتروني
      <input name="identifier" required autofocus>
    </label>
    <label>كلمة المرور
      <input name="password" type="password" required>
    </label>
    <button type="submit">دخول</button>
  </form>
  <p class="muted">حسابات للتجربة: <code>user1</code> ... <code>user1000</code> · كلمة المرور = اسم المستخدم نفسه (مثلاً <code>user1</code> / <code>user1</code>)</p>
</section>
{% endblock %}
